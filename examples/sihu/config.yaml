# Converted from scenario.par / scenario.obj for the local sihu project.
# Both scenario.par and HydroPilot use r as original * (1 + r).
# COL_2 is interpreted as FLOW_OUT; the legacy reader source was unavailable.
version: swat
basic:
  projectPath: ../../work/sihu_calibration/project
  workPath: ../../work/sihu_calibration/runs
  command: /home/wmtsky/projects/swat2012/build/swat2012
  timeout: 180
  parallel: 1
  keepCopies: true
  reset: false
