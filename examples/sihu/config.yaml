    bounds:
    - 0.0
    - 1.0
  - name: RCHRG_DP
    mode: v
    bounds:
    - 0.0
    - 1.0
  - name: SOL_AWC
    mode: r
  - name: SOL_K
    mode: r
  - name: SOL_ALB
    mode: r
  - name: CH_N2
    mode: v
    bounds:
    - -0.01
    - 0.3
  - name: CH_K2
    mode: v
    bounds:
    - -0.01
    - 500.0
  - name: ALPHA_BNK
    mode: v
    bounds:
    - 0.05
    - 1.0
  - name: TLAPS
    mode: v
    bounds:
    - -10.0
