  - name: EPCO
    bounds:
    - 0.01
    - 1.0
  - name: SURLAG
    bounds:
    - 0.05
    - 24.0
  physical:
  - name: CN2
    mode: r
  - name: GW_DELAY
    mode: v
    bounds:
    - 0.0
    - 500.0
  - name: ALPHA_BF
    mode: v
    bounds:
    - 0.0
    - 1.0
  - name: GWQMN
    mode: v
    bounds:
    - 0.0
    - 500.0
  - name: GW_REVAP
    mode: v
    bounds:
    - 0.02
    - 0.2
  - name: REVAPMN
