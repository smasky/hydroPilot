    - 24.0
  hardBound: true
series:
- id: flow
  desc: Reach 40 daily flow; scenario.obj COL_2 interpreted as FLOW_OUT
  sim:
    file: output.rch
    id: 40
    variable: FLOW_OUT
    period:
    - 2011
    - 2014
  obs:
    file: obs_flow_2011_2014.txt
    readerType: text
    colNum: 1
    rowRanges:
    - - 1
      - 1461
functions:
- name: NSE
  kind: builtin
- name: RMSE
  kind: builtin
- name: PBIAS
  kind: builtin
derived:
- id: nse
  call:
    func: NSE
    args:
    - flow.sim
    - flow.obs
- id: rmse
  call:
    func: RMSE
    args:
    - flow.sim
    - flow.obs
- id: pbias
  call:
    func: PBIAS
    args:
    - flow.sim
    - flow.obs
objectives:
- id: obj_nse
  ref: nse
  sense: max
diagnostics:
- id: diag_rmse
  ref: rmse
- id: diag_pbias
  ref: pbias
reporter:
  series:
  - flow
