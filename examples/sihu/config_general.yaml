series:
  - id: flow
    desc: Reach 40 daily flow; scenario.obj COL_2 interpreted as FLOW_OUT
    sim:
      readerType: text
      file: output.rch
      rowRanges:
        - [44985, 104845, 41]
      colSpan: [52, 61]
    obs:
      readerType: text
      file: obs_flow_2011_2014.txt
      rowRanges:
        - [1, 1461]
      colNum: 1
derived:
  - id: nse
    desc: nse
    call:
      func: NSE
      args: [flow.sim, flow.obs]
  - id: rmse
    desc: rmse
    call:
      func: RMSE
      args: [flow.sim, flow.obs]
  - id: pbias
    desc: pbias
    call:
      func: PBIAS
      args: [flow.sim, flow.obs]
objectives:
  - id: obj_nse
    ref: nse
    desc: obj_nse
    sense: max
    on_error: -.inf
diagnostics:
  - id: diag_rmse
    ref: rmse
    name: diag_rmse
    on_error: .nan
  - id: diag_pbias
    ref: pbias
    name: diag_pbias
    on_error: .nan
reporter:
  flushInterval: 50
  holdingPenLimit: 20
  series: [flow]
