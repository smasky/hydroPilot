  evap_adj:
    type: float
    bounds: [0.0, 2.0]
    file: {name: "parameters.bsn", line: 2, start: 241, width: 12, precision: 5, maxNum: 1}

  scoef:
    type: float
    bounds: [0.0, 2.0]
    file: {name: "parameters.bsn", line: 2, start: 253, width: 12, precision: 5, maxNum: 1}

  denit_exp:
    type: float
    bounds: [0.0, 3.0]
    file: {name: "parameters.bsn", line: 2, start: 265, width: 12, precision: 5, maxNum: 1}

  denit_frac:
    type: float
    bounds: [0.0, 2.0]
    file: {name: "parameters.bsn", line: 2, start: 277, width: 12, precision: 5, maxNum: 1}

  man_bact:
