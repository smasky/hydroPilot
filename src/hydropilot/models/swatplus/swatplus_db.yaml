# =============================================================================
# SWAT+ knowledge database — v1.2 position-corrected expansion
# =============================================================================
#
# This YAML file is the single source of truth for SWAT+ parameter metadata and
# output-series column layouts. It is loaded by library.py and consumed by:
#   - builder.py  (paramDb lookup for type / bounds / file location)
#   - validate.py (design parameter name check against known parameters)
#   - series.py   (variable → colSpan/colNum resolution)
#
# -----------------------------------------------------------------------------
# Schema — parameter entry
# -----------------------------------------------------------------------------
# Each parameter entry requires:
#   type:   "float" | "int"
#   bounds: [min, max]          # .inf / -.inf for unbounded
#   file:
#     name:      <filename>     # e.g. "parameters.bsn", "hydrology.hyd"
#     line:      <int>          # 1-based data line (after any header)
#     start:     <int>          # 1-based column start
#     width:     <int>          # field width in characters
#     precision: <int>          # decimal places written (0 for int)
#     maxNum:    <int>          # 1 for scalar, >1 for multi-row per object
#
# -----------------------------------------------------------------------------
# Schema — series entry
# -----------------------------------------------------------------------------
# Each series source requires:
#   file:         <filename>    # {object}_{report}_{frequency}.txt
#   object:       basin | hru | hru-lte | lsunit | ru | channel | aquifer | reservoir | hyd
#   report:       wb | nb | ls | pw | crop_yld | sd
#   frequency:    aa | yr | mo | da
#   header_lines: <int>
#   variables:
#     - name:   <VARIABLE_NAME>
#       colSpan: [start, end]   # 1-based inclusive; OR
#       colNum:  <int>          # single column
#
# -----------------------------------------------------------------------------
# Inclusion guidelines — what belongs in this DB
# -----------------------------------------------------------------------------
# INCLUDE:
#   - Parameters whose fixed-width file position is known and stable across
#     SWAT+ revisions
#   - Parameters that need bounds checking (absolute physical ranges)
#   - Parameters the builder must resolve when a user supplies only a name
#     (i.e. lookup type + file location from the DB)
#   - Output files + variables whose column positions are documented
#
# EXCLUDE:
#   - Runtime-computed values (e.g. CN2 adjusted by soil moisture)
#   - Project-specific counts or configuration (n_hrus, start_year, timestep —
#     these come from discovery.py, not the DB)
#   - Management schedule data (ops schedules are too complex for YAML)
#   - Weather generator parameters (not calibration targets)
#   - Connectivity table entries (hru.con, rout_unit.con — structural, not
#     parameterisable)
#
# -----------------------------------------------------------------------------
# Position verification:
#   All column positions verified against Ames_sub1 Rev 60.5.7 refdata
#   (parameters.bsn, hydrology.hyd, soils.sol) and Osu_1hru Rev 60.5.4
#   (hyd-sed-lte.cha).  Field order cross-checked with SWAT+ FORTRAN source
#   structs in basin_module.f90, channel_module.f90, soil_module.f90.
#
#   parameters.bsn:  44 fields × 12-char slots, list-directed read in source
#   hydrology.hyd:   14 fields × 14-char slots after 23-char name column
#   hyd-sed-lte.cha: 23 fields, variable-width, line 2 header + line 3+ data
#   soils.sol:       two-level format — per-soil scalar row + per-layer rows
#                     (NLY controls layer count; positions are per-layer row)
# =============================================================================

parameters:

  # ===========================================================================
  # Group A: parameters.bsn — basin-level parameters (44 fields, single row)
  #   Format: 44 × 12-char slots, right-justified F12.5 values.
  #   Source struct: basin_module.f90 :: basin_parms (42 real + 2 integer).
  #   Read by: basin_read_prm.f90 via list-directed read(107,*).
  #   line: 2 = data row (after 1-line title header in Ames_sub1 format).
  #   maxNum: 1 — single value applies globally.
  # ===========================================================================

  lai_noevap:
    type: float
    bounds: [0.0, .inf]
    file: {name: "parameters.bsn", line: 2, start: 1, width: 12, precision: 5, maxNum: 1}

  sw_init:
    type: float
    bounds: [0.0, 1.0]
    file: {name: "parameters.bsn", line: 2, start: 13, width: 12, precision: 5, maxNum: 1}

  surq_lag:
    type: float
    bounds: [0.05, 24.0]
    file: {name: "parameters.bsn", line: 2, start: 25, width: 12, precision: 5, maxNum: 1}

  adj_pkrt:
    type: float
    bounds: [0.0, 3.0]
    file: {name: "parameters.bsn", line: 2, start: 37, width: 12, precision: 5, maxNum: 1}

  adj_pkrt_sed:
    type: float
    bounds: [0.0, .inf]
    file: {name: "parameters.bsn", line: 2, start: 49, width: 12, precision: 5, maxNum: 1}

  lin_sed:
    type: float
    bounds: [0.0, .inf]
    file: {name: "parameters.bsn", line: 2, start: 61, width: 12, precision: 5, maxNum: 1}

  exp_sed:
