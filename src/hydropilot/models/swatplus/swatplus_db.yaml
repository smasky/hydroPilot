    file: {name: "parameters.bsn", line: 2, start: 289, width: 12, precision: 5, maxNum: 1}

  adj_uhyd:
    type: float
    bounds: [-.inf, .inf]
    file: {name: "parameters.bsn", line: 2, start: 301, width: 12, precision: 5, maxNum: 1}

  cn_froz:
    type: float
    bounds: [0.0, 1.0]
    file: {name: "parameters.bsn", line: 2, start: 313, width: 12, precision: 5, maxNum: 1}

  dorm_hr:
    type: float
    bounds: [0.0, .inf]
    file: {name: "parameters.bsn", line: 2, start: 325, width: 12, precision: 5, maxNum: 1}

  plaps:
    type: float
    bounds: [-1000.0, 1000.0]
    file: {name: "parameters.bsn", line: 2, start: 337, width: 12, precision: 5, maxNum: 1}

  tlaps:
    type: float
    bounds: [-10.0, 10.0]
    file: {name: "parameters.bsn", line: 2, start: 349, width: 12, precision: 5, maxNum: 1}

  n_fix_max:
    type: float
    bounds: [0.0, .inf]
    file: {name: "parameters.bsn", line: 2, start: 361, width: 12, precision: 5, maxNum: 1}

  rsd_decay:
    type: float
    bounds: [0.0, 0.1]
    file: {name: "parameters.bsn", line: 2, start: 373, width: 12, precision: 5, maxNum: 1}

  rsd_cover:
    type: float
