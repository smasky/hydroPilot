  n_uptake:
    type: float
    bounds: [0.0, .inf]
    file: {name: "parameters.bsn", line: 2, start: 97, width: 12, precision: 5, maxNum: 1}

  p_uptake:
    type: float
    bounds: [0.0, .inf]
    file: {name: "parameters.bsn", line: 2, start: 109, width: 12, precision: 5, maxNum: 1}

  n_perc:
    type: float
    bounds: [0.0, 1.0]
    file: {name: "parameters.bsn", line: 2, start: 121, width: 12, precision: 5, maxNum: 1}

  p_perc:
    type: float
    bounds: [0.0, 20.0]
    file: {name: "parameters.bsn", line: 2, start: 133, width: 12, precision: 5, maxNum: 1}

  p_soil:
    type: float
    bounds: [0.0, .inf]
    file: {name: "parameters.bsn", line: 2, start: 145, width: 12, precision: 5, maxNum: 1}

  p_avail:
    type: float
    bounds: [0.0, 2.0]
    file: {name: "parameters.bsn", line: 2, start: 157, width: 12, precision: 5, maxNum: 1}

  rsd_decomp:
    type: float
    bounds: [0.0, 1.0]
    file: {name: "parameters.bsn", line: 2, start: 169, width: 12, precision: 5, maxNum: 1}

  pest_perc:
    type: float
    bounds: [0.0, 1.0]
    file: {name: "parameters.bsn", line: 2, start: 181, width: 12, precision: 5, maxNum: 1}

  msk_co1:
    type: float
    bounds: [0.0, 1.0]
    file: {name: "parameters.bsn", line: 2, start: 193, width: 12, precision: 5, maxNum: 1}

  msk_co2:
    type: float
    bounds: [0.0, 1.0]
    file: {name: "parameters.bsn", line: 2, start: 205, width: 12, precision: 5, maxNum: 1}

  msk_x:
    type: float
